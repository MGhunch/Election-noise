name: Publish policies from Airtable

on:
  workflow_dispatch:
  # When the dataset settles, uncomment for a daily publish at 7am NZT:
  # schedule:
  #   - cron: "0 19 * * *"

permissions:
  contents: write

# Two runs pushing to main at once would race the same way a run races a manual
# upload. Queue them instead of cancelling — a queued publish still needs to
# happen, it just needs to happen second.
concurrency:
  group: publish-policies
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Export from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node scripts/export-policies.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet data/policies.json; then
            echo "No changes — nothing to publish."
            exit 0
          fi

          git config user.name "election-noise-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/policies.json
          git commit -m "Publish policies.json from Airtable ($(date -u +%Y-%m-%d))"

          # The runner checks out main at the start of the job, and main can move
          # while the job runs — a file uploaded through the GitHub UI is enough
          # to do it. Rebasing puts this commit on top of whatever arrived in the
          # meantime rather than trying to push a branch that has fallen behind.
          #
          # policies.json is generated, never hand-edited, so if a rebase ever
          # does conflict on it, the freshly exported version is the correct one.
          git pull --rebase --strategy-option=ours origin main

          # One retry. A second race in the same few seconds is unlikely, and
          # failing loudly beats looping.
          git push || {
            echo "Push raced again — rebasing once more."
            git pull --rebase --strategy-option=ours origin main
            git push
          }
