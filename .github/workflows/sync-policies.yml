name: Publish policies from Airtable

on:
  workflow_dispatch:
  # When the dataset settles, uncomment for a daily publish at 7am NZT:
  # schedule:
  #   - cron: "0 19 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Export from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node scripts/export-policies.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet data/policies.json; then
            echo "No changes — nothing to publish."
            exit 0
          fi
          git config user.name "election-noise-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/policies.json
          git commit -m "Publish policies.json from Airtable ($(date -u +%Y-%m-%d))"
          git push
